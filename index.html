<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>The Legend of Elelhem : La Magie de Lia</title>
  <meta name="description" content="Un petit RPG HD-2D dans le navigateur : à Elelhem, on apprend la magie LIA auprès des maîtres du village, et chacun transpose une notion d'IA. Décor, lumière et personnages générés par le code, portraits illustrés.">
  <meta name="theme-color" content="#231b2b">
  <meta name="author" content="Jordan Goussery">
  <link rel="canonical" href="https://amael-alt.github.io/elelhem/">

  <!-- Aperçu sur les réseaux sociaux. L'image de partage est lue par les
       réseaux, jamais par la page ; l'adresse doit y être complète. Elle se
       refait avec outils/vignette.mjs. -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="The Legend of Elelhem">
  <meta property="og:title" content="The Legend of Elelhem : La Magie de Lia">
  <meta property="og:description" content="Huit notions d'IA, un village, dix minutes. Un petit RPG à jouer dans le navigateur, sur téléphone ou sur ordinateur, où le décor et les personnages sont générés par le code.">
  <meta property="og:url" content="https://amael-alt.github.io/elelhem/">
  <meta property="og:image" content="https://amael-alt.github.io/elelhem/assets/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="L'illustration de The Legend of Elelhem à l'aquarelle : un jeune voyageur au chapeau rouge tend la main vers une flamme de magie, devant un château dans les nuages, à côté du titre doré.">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Favicon : l'étincelle de la magie LIA, dessinée en SVG ici même. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181530'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='5.5' fill='none' stroke='%23a8803e'/%3E%3Cpath d='M16 4.5Q17.5 14.5 27.5 16Q17.5 17.5 16 27.5Q14.5 17.5 4.5 16Q14.5 14.5 16 4.5Z' fill='%23f3d08c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">

  <!-- Carte d'import : le nom « three » désigne la copie vendue dans le dépôt.
       Aucun bundler, GitHub Pages sert ces fichiers tels quels. -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js"
      }
    }
  </script>

  <!-- Navigateur trop ancien pour les cartes d'import (iOS 15 et avant) :
       un message propre plutôt qu'une page noire. -->
  <script>
    if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap'))) {
      document.addEventListener('DOMContentLoaded', function () {
        var box = document.getElementById('message');
        box.textContent = 'Ce navigateur est trop ancien pour ouvrir le village. Essaie avec une version récente de Chrome, Firefox, Safari ou Edge.';
        box.hidden = false;
      });
    }
  </script>
  <!-- Le jeu se charge en environ 150 modules. Si un seul manque (GitHub Pages
       répond parfois 503 quelques minutes après une mise en ligne), rien ne
       démarre et l'écran resterait violet. Alors on recharge la page une fois
       d'elle-même (une réponse 503 n'est pas gardée en cache), puis, si cela
       échoue encore, on le dit avec un bouton pour réessayer. -->
  <script type="module">
    const RETRY_KEY = 'elelhem-rechargement';
    import('./src/main.js').then(() => {
      try { sessionStorage.removeItem(RETRY_KEY); } catch {}
    }).catch((error) => {
      console.error(error);
      let retried = false;
      try {
        retried = sessionStorage.getItem(RETRY_KEY) === '1';
        if (!retried) sessionStorage.setItem(RETRY_KEY, '1');
      } catch {
        retried = true; // sans stockage, pas de boucle de rechargements
      }
      if (!retried) {
        window.location.reload();
        return;
      }
      const show = () => {
        const box = document.getElementById('message');
        box.replaceChildren();
        const text = document.createElement('p');
        text.textContent = "Le village n'a pas fini de se charger. La connexion a dû hoqueter : réessaie dans un instant.";
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'message-recharger';
        button.textContent = 'Réessayer';
        button.addEventListener('click', () => {
          try { sessionStorage.removeItem(RETRY_KEY); } catch {}
          window.location.reload();
        });
        const inner = document.createElement('div');
        inner.append(text, button);
        box.append(inner);
        box.hidden = false;
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
      else show();
    });
  </script>
</head>
<body>
  <canvas id="scene" aria-label="Le village d'Elelhem"></canvas>
  <div id="debug" hidden></div>

  <!-- Joystick flottant : apparaît sous le pouce, dans le bas de l'écran, du
       côté choisi sur l'écran titre (gauche par défaut). -->
  <div id="stick" hidden aria-hidden="true"><div class="stick-bille"></div></div>

  <!-- Bulle « parler » au-dessus de l'habitant à portée (dessin maison, en SVG). -->
  <button id="indice" type="button" tabindex="-1" hidden>
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-7l-4.5 3.5V16.5H5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5z"/>
      <path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/>
    </svg>
    <span class="touche" aria-hidden="true">E</span>
  </button>

  <!-- Bouton d'action des écrans tactiles, sous le pouce libre : une étincelle
       au repos, une bulle quand un habitant est à portée (src/game/ui.js). -->
  <button id="action" type="button" tabindex="-1" hidden>
    <svg class="action-etincelle" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2.5Q13.2 10.8 21.5 12Q13.2 13.2 12 21.5Q10.8 13.2 2.5 12Q10.8 10.8 12 2.5Z"/>
    </svg>
    <svg class="action-bulle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v9a1.5 1.5 0 0 1-1.5 1.5h-7l-4.5 3.5V16.5H5A1.5 1.5 0 0 1 3.5 15V6A1.5 1.5 0 0 1 5 4.5z"/>
      <path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/>
    </svg>
  </button>

  <!-- Bouton d'attaque des écrans tactiles, au-dessus du bouton d'action, sur la
       lande seulement (src/game/combat.js). -->
  <button id="attaque" type="button" tabindex="-1" hidden></button>

  <!-- Couper ou remettre la musique (touche M). Deux pictogrammes dessinés ici. -->
  <button id="son" type="button" tabindex="-1" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke-width="1.5"/>
      <path class="son-ondes" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
      <path class="son-croix" d="M16 9.5l5 5M21 9.5l-5 5"/>
    </svg>
  </button>

  <!-- Le lieu où l'on est, sous la minimap (src/game/banner.js). -->
  <p id="endroit" hidden><span class="endroit-monde"></span><span class="endroit-lieu"></span></p>

  <!-- Bandeau de lieu : le nom du quartier où l'on entre. -->
  <div id="lieu" hidden aria-live="polite"><span class="lieu-filet" aria-hidden="true"></span><p class="lieu-nom"></p><span class="lieu-filet" aria-hidden="true"></span></div>

  <!-- Écran titre (version 2.1) : une page de parchemin, comme le menu d'un
       RPG d'autrefois. L'illustration, le voyageur qui bondit vers la flamme
       de la magie LIA (la flamme du logo Maintenant Vous Savez, redessinée),
       est la seule image chargée avant le lancement, avec les ornements de
       l'interface. -->
  <!-- L'écran titre (version 2.6) : l'illustration porte le titre, le menu,
       le prénom et la signature sont posés dessus à droite (ou dessous, sur
       un écran étroit) ; le cache couvre la partie dessinée qu'ils remplacent. -->
  <div id="titre" hidden>
    <div class="titre-scene">
      <div class="titre-image">
        <img class="titre-illustration" src="assets/ui/titre.webp" alt="" width="1672" height="941">
        <div class="titre-cache" aria-hidden="true"></div>
      </div>
      <div class="titre-texte">
        <h1 class="titre-nom titre-invisible"></h1>
        <p class="titre-contree titre-invisible"></p>
        <p class="titre-accroche titre-invisible"></p>
        <!-- Le menu : continuer la partie sauvegardée, ou en commencer une nouvelle. -->
        <nav class="titre-menu" aria-label="Menu">
          <button class="titre-commencer" type="button"></button>
          <button class="titre-nouvelle" type="button"></button>
        </nav>
        <label class="titre-prenom"><span></span><input type="text" autocomplete="given-name" spellcheck="false"></label>
        <!-- Côté du joystick, sur écran tactile seulement (src/game/settings.js). -->
        <button class="titre-commandes" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/>
          </svg>
          <span></span>
        </button>
        <p class="titre-credits"><span class="titre-signature"></span><a class="titre-site" target="_blank" rel="noopener"></a><span class="titre-droits"></span></p>
      </div>
    </div>
  </div>

  <!-- La légende des touches, sur ordinateur seulement (src/game/keys.js). -->
  <aside id="touches" hidden>
    <p class="touches-titre"></p>
    <ul class="touches-liste"></ul>
  </aside>

  <!-- Compteur de parchemins, en haut à gauche : rempli par src/game/scrolls.js.
       On le touche pour ouvrir le grimoire. -->
  <div id="parchemins" hidden>
    <div class="parchemins-ligne">
      <button class="parchemins-rangee" type="button" tabindex="-1"></button>
    <!-- La feuille de personnage (touche F, src/game/sheet.js). -->
    <button id="fiche" class="fiche-bouton" type="button" tabindex="-1" hidden></button>
      <!-- La bourse : les Tokens du héros (src/game/wallet.js). -->
      <div id="tokens" role="status"><span class="tokens-piece" aria-hidden="true"></span><span class="tokens-montant">0</span><span class="tokens-gain" aria-hidden="true"></span></div>
    <!-- Les clartés : les points de vie du héros (src/game/combat.js). -->
    <div id="clartes" role="status" hidden><span class="clarte"></span><span class="clarte"></span><span class="clarte"></span><span class="clarte"></span><span class="clarte"></span></div>
    </div>
    <p class="parchemins-annonce" role="status" hidden></p>
  </div>

  <!-- Le diplôme, dessiné sur un canvas par src/game/diploma.js. -->
  <div id="diplome" role="dialog" aria-modal="true" hidden>
    <div class="diplome-cadre">
      <canvas class="diplome-toile" role="img"></canvas>
      <div class="diplome-actions">
        <label class="diplome-prenom"><span></span><input type="text" autocomplete="given-name" spellcheck="false"></label>
        <div class="diplome-boutons">
          <button class="diplome-partager" type="button" hidden></button>
          <button class="diplome-telecharger" type="button"></button>
          <button class="diplome-copier" type="button"></button>
          <button class="diplome-fermer" type="button"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- Minimap en haut à droite, et la carte en grand (src/game/minimap.js). -->
  <button id="minimap" type="button" tabindex="-1" hidden><canvas></canvas></button>
  <div id="carte" role="dialog" aria-modal="true" aria-labelledby="carte-titre" hidden>
    <div class="carte-cadre">
      <div class="coins" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="carte-titre" id="carte-titre"></p>
      <canvas class="carte-toile" role="img"></canvas>
      <ul class="carte-legende"></ul>
      <button class="carte-fermer" type="button"></button>
    </div>
  </div>

  <!-- La boutique de Berthe : les tenues du héros (src/game/shop.js). -->
  <div id="boutique" role="dialog" aria-modal="true" aria-labelledby="boutique-titre" hidden>
    <div class="boutique-cadre">
      <div class="coins" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="boutique-titre" id="boutique-titre"></p>
      <p class="boutique-bourse"></p>
      <ul class="boutique-liste"></ul>
      <button class="boutique-fermer" type="button"></button>
    </div>
  </div>

  <!-- Le grimoire : les parchemins gagnés, à relire (src/game/grimoire.js). -->
  <div id="grimoire" role="dialog" aria-modal="true" aria-labelledby="grimoire-titre" hidden>
    <div class="grimoire-livre">
      <div class="coins" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <p class="grimoire-titre" id="grimoire-titre"></p>
      <nav class="grimoire-onglets"></nav>
      <article class="grimoire-page">
        <p class="grimoire-numero"></p>
        <h2 class="grimoire-notion"></h2>
        <p class="grimoire-maitre"></p>
        <p class="grimoire-maxime"></p>
        <div class="grimoire-lecon"></div>
      </article>
      <div class="grimoire-boutons">
        <button class="grimoire-precedente" type="button"></button>
        <button class="grimoire-fermer" type="button"></button>
        <button class="grimoire-suivante" type="button"></button>
      </div>
    </div>
  </div>

  <!-- Réplique d'un figurant, en bulle au-dessus de sa tête (src/game/chatter.js). -->
  <p id="replique" aria-live="polite" hidden></p>

  <!-- Nom de l'habitant qui approche, au-dessus de sa tête. -->
  <div id="nom" hidden></div>
  <!-- Les chiffres de dégâts, posés sur le canvas (src/game/damage.js). -->
  <div id="degats" aria-hidden="true"></div>

  <!-- La forge de Ferrand : le menu Forger (src/game/forge.js). -->
  <div id="forge" role="dialog" aria-modal="true" aria-labelledby="forge-titre" hidden>
    <div class="forge-cadre">
      <div class="coins" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h2 class="forge-titre" id="forge-titre"></h2>
      <p class="forge-bourse"></p>
      <ul class="forge-liste"></ul>
      <button class="forge-fermer" type="button"></button>
    </div>
  </div>

  <!-- La feuille de personnage (src/game/sheet.js). -->
  <div id="feuille" role="dialog" aria-modal="true" aria-labelledby="feuille-titre" hidden>
    <div class="feuille-cadre">
      <div class="coins" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="feuille-tete">
        <div class="feuille-portrait" aria-hidden="true"><img src="assets/portraits/heros.png" alt="" decoding="async" loading="lazy"></div>
        <div class="feuille-identite">
          <h2 class="feuille-titre" id="feuille-titre"></h2>
          <p class="feuille-prenom"></p>
          <p class="feuille-sous-titre"></p>
        </div>
      </div>
      <dl class="feuille-stats"></dl>
      <h3 class="feuille-notions-titre"></h3>
      <ol class="feuille-notions"></ol>
      <!-- Les exploits (version 2.3, src/game/exploits.js) : six sceaux. -->
      <h3 class="feuille-exploits-titre"></h3>
      <ul class="feuille-exploits"></ul>
      <button class="feuille-fermer" type="button"></button>
    </div>
  </div>

  <!-- Boîte de dialogue : remplie par src/game/dialogue.js. -->
  <div id="dialogue" role="dialog" aria-labelledby="dialogue-nom" hidden>
    <div class="coins" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="dialogue-portrait" aria-hidden="true" hidden><img alt="" decoding="async"></div>
    <p class="dialogue-nom" id="dialogue-nom"></p>
    <p class="dialogue-texte"><span class="vu"></span><span class="reste"></span></p>
    <ol class="dialogue-choix" hidden></ol>
    <span class="dialogue-suite" aria-hidden="true"></span>
  </div>

  <!-- Le générique de fin, après le diplôme (src/game/credits.js). -->
  <div id="generique" role="dialog" aria-modal="true" aria-label="Générique" hidden>
    <div class="generique-defile"></div>
    <button class="generique-passer" type="button"></button>
  </div>

  <!-- Fondu au noir, au passage d'une porte (src/game/doors.js). -->
  <div id="fondu" hidden></div>

  <div id="message" role="alert" hidden></div>
  <noscript><div class="noscript">Le village a besoin de JavaScript pour s'afficher.</div></noscript>
</body>
</html>
